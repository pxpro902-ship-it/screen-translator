name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ekstrak ZIP terbaru
        run: |
          ZIP="$(git log --diff-filter=AM --name-only --pretty=format: -- '*.zip' | grep -v '^$' | head -n1)"
          echo "Memakai: $ZIP"
          unzip -q "$ZIP"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: IndonesiaAIScreenTranslator
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: IndonesiaAIScreenTranslator/app/build/outputs/apk/debug/app-debug.apk
